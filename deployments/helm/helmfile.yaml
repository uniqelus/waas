environments:
  local:

---

repositories:
  - name: nats
    url: https://nats-io.github.io/k8s/helm/charts

releases:
  - name: nats
    namespace: waas
    createNamespace: true
    chart: nats/nats
    version: 2.14.6
    values:
      - ./values/{{ .Environment.Name }}/nats.yaml

  - name: runtime
    namespace: waas
    createNamespace: true
    chart: ./charts/runtime
    values:
      - ./values/{{ .Environment.Name }}/runtime.yaml